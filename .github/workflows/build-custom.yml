name: Build Custom Pulse

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Pulse
        shell: cmd
        run: build_release.bat
      - name: Upload custom pulse binary
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Custom-400w
          path: |
            build/pulse.exe
            build/lumatext.dll
            build/pdfium.dll
